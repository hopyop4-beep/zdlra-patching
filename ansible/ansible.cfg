[defaults]
inventory = inventory/hosts.yml
roles_path = roles
filter_plugins = filter_plugins
test_plugins = test_plugins
# Every run's output, for change-control evidence. The step logs stay on the nodes, in
# each run's folder.
log_path = logs/ansible.log
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = false
host_key_checking = true
# A long patch step is polled, never held open, so a short command timeout is fine.
timeout = 30
forks = 5

[ssh_connection]
# Keep polls cheap over hours of waiting.
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=10m -o ServerAliveInterval=30 -o BatchMode=yes
