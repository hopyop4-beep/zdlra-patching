---
# snapshot: save configuration and state before patching, to compare in postcheck.
# TODO: capture CRS resource state (crsctl stat res -t), listener status, DB parameters,
#       storage locations, protection policies, and replication config.
- name: Create the snapshot folder
  ansible.builtin.file:
    path: "{{ zdlra_run_dir }}/snapshot_before"
    state: directory
    mode: "0750"

- name: Save racli version and appliance status
  ansible.builtin.shell: "{{ zdlra_racli }} {{ item.args }} > {{ zdlra_run_dir }}/snapshot_before/{{ item.file }} 2>&1"
  loop:
    - { args: version, file: racli_version.txt }
    - { args: status appliance, file: racli_status.txt }
  changed_when: false
  failed_when: false

- name: Snapshot saved
  ansible.builtin.debug:
    msg: "Snapshot saved to {{ zdlra_run_dir }}/snapshot_before"
