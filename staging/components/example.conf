# Optional override of component settings for one appliance. Normally zdlra_stage.sh
# asks the appliance itself (COMPONENT_CMDS); a value set here wins over what it
# finds. Copy to components/<appliance>.conf (for example components/zdlra01.conf;
# real files are not committed).
#
# Read as plain KEY=VALUE lines. Values: letters, digits and . _ , : @ -
# Lists are comma-separated. Write KEY= to set an empty value on purpose.

# CELL_NODE=zdlra01cel01,zdlra01cel02,zdlra01cel03
# SWITCH_TYPE=roce
# SWITCHES=zdlra01sw-rocea0,zdlra01sw-roceb0
# IB_SWITCHES=
# RA_DATABASE=zdlra01
