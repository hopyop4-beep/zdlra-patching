<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZDLRA code tracer</title>
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#1c2422;--muted:#5a6663;--line:#d3d8d2;--accent:#0b5c6b;--accent-soft:#d9ebee;--sel:#fff3c4;--task:#eef5f0;--soft:#eceee9;--code:#fbfbf9;
--c-com:#6b7a76;--c-key:#0b5c6b;--c-str:#7a4a12;--c-jin:#6a3f9a;--c-mod:#2f6b3a;--c-num:#9a3412;
--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;color-scheme:light}
:root[data-theme="dark"]{--bg:#141918;--panel:#1c2321;--ink:#e6ebe8;--muted:#9aa7a2;--line:#33403c;--accent:#6cc3d4;--accent-soft:#17353b;--sel:#3d3618;--task:#1a2a24;--soft:#252c2a;--code:#171d1b;
--c-com:#7f8f8a;--c-key:#6cc3d4;--c-str:#e0b878;--c-jin:#c4a7f0;--c-mod:#86d196;--c-num:#f0a070;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 10px;cursor:pointer}button:hover{border-color:var(--accent)}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;white-space:nowrap}header .rev{font:12px var(--mono);color:var(--muted)}
#search{flex:1;max-width:520px;position:relative}#search input{width:100%;font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#results{position:absolute;top:34px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.15);max-height:60vh;overflow:auto;z-index:20;display:none}
#results div{padding:5px 10px;cursor:pointer;border-bottom:1px solid var(--soft)}#results div:hover,#results div.on{background:var(--accent-soft)}#results small{color:var(--muted);margin-left:6px}
.spacer{flex:1}
#main{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr) 430px;min-height:0}
#side,#explain{overflow:auto;background:var(--panel);min-height:0}#side{border-right:1px solid var(--line)}#explain{border-left:1px solid var(--line);padding:0 16px 40px}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}.tabs button{flex:1;border:0;border-radius:0;padding:8px 4px;background:none;color:var(--muted);border-bottom:2px solid transparent}.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#sidebody{padding:8px 0}
.dir{font-size:12px;color:var(--muted);padding:8px 12px 2px;font-weight:600;letter-spacing:.02em}
.fl{display:block;padding:2px 12px 2px 20px;color:var(--ink);font:13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fl:hover{background:var(--soft);text-decoration:none}.fl.on{background:var(--accent-soft);font-weight:600}.fl .star{color:#c08a00}
.ol{display:block;padding:2px 10px;color:var(--ink);font-size:13px;border-left:2px solid transparent}.ol:hover{background:var(--soft);text-decoration:none}.ol.on{border-left-color:var(--accent);background:var(--accent-soft)}.ol small{color:var(--muted);font:11px var(--mono)}
.gl{padding:6px 12px;border-bottom:1px solid var(--soft)}.gl b{font:600 13px var(--mono)}.gl p{margin:2px 0 0;font-size:13px;color:var(--muted)}
#center{display:flex;flex-direction:column;min-height:0;min-width:0}
#filehead{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#filehead .path{font:600 14px var(--mono)}#filehead .meta{color:var(--muted);font-size:12px;margin-left:8px}
#filehead details{margin-top:6px}#filehead summary{cursor:pointer;color:var(--muted);font-size:13px}#filehead pre{white-space:pre-wrap;font:13px/1.45 var(--body);margin:6px 0 0;max-height:110px;overflow:auto}
#code{flex:1;overflow:auto;position:relative;background:var(--code);font:13px/1.55 var(--mono);padding:6px 0 40vh}
.L{display:flex;white-space:pre;cursor:pointer;min-width:max-content}.L:hover{background:var(--soft)}.L.task{background:var(--task)}.L.sel{background:var(--sel)!important}
.L .n{flex:none;width:52px;text-align:right;padding-right:14px;color:var(--muted);user-select:none}.L .t{padding-right:24px}
.L .t a{border-bottom:1px dotted currentColor;color:inherit}.L .t a:hover{background:var(--accent-soft);text-decoration:none}
.L .t a.k-file,.L .t a.k-role{color:var(--accent);border-bottom-style:solid}
.com{color:var(--c-com);font-style:italic}.key{color:var(--c-key)}.str{color:var(--c-str)}.jin{color:var(--c-jin)}.mod{color:var(--c-mod);font-weight:600}.num{color:var(--c-num)}
#explain h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px;font-weight:600}
#explain .snip{font:12.5px/1.5 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:pre-wrap;word-break:break-word;margin-top:14px}
.card{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin:0 0 8px;background:var(--panel)}
.card b{display:block;font-size:13.5px}.card p{margin:3px 0 0;font-size:13.5px}.card .doc{white-space:pre-wrap;font-size:13px;color:var(--ink);background:var(--soft);border-radius:4px;padding:5px 8px;margin-top:5px}
.card.plain{border-left-color:#c08a00}.card.plain p{margin:0 0 5px}.card.plain p:last-child{margin-bottom:0}.card code,.card.plain code{font:12.5px var(--mono);background:var(--soft);border-radius:3px;padding:0 3px}
.calls{margin:4px 0 0;padding-left:18px}.calls li{font-size:13px;margin:2px 0}.calls .how{color:var(--muted);font-size:12px}
.card.task{border-left-color:#2f6b3a}.card.conn{border-left-color:#7a5c12}.card.concept{border-left-color:#5b4a8a}.card.note{border-left-color:var(--muted)}.card.hi{box-shadow:0 0 0 2px var(--accent)}
.card ul{margin:4px 0 0;padding-left:18px}.card li{margin:2px 0;font-size:13px}.card .src{font:12px var(--mono);color:var(--muted);display:block;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.where{font:12px var(--mono)}
.chain{font:12px var(--mono);margin:4px 0;padding:5px 8px;background:var(--soft);border-radius:4px;line-height:1.7}.chain .arrow{color:var(--muted);padding:0 4px}
.pill{display:inline-block;font:600 11px var(--body);padding:0 6px;border-radius:3px;background:var(--accent-soft);color:var(--ink);margin-right:4px;vertical-align:1px}
.empty{color:var(--muted);font-size:13.5px;margin-top:20px}
textarea{width:100%;font:13px var(--body);border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);min-height:60px}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}.ok{color:#2f6b3a;font-size:13px}
.help{font-size:13px;color:var(--muted)}.help kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--soft)}
/*ASK-BEGIN*/.msg{font-size:13.5px;border-radius:6px;padding:6px 10px;margin:0 0 8px}.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}.msg ul{margin:2px 0 6px;padding-left:18px}.msg code{font:12.5px var(--mono);background:var(--soft);border-radius:3px;padding:0 3px}.msg .snip{margin:4px 0 6px}
.msg.me{background:var(--accent-soft);white-space:pre-wrap}.msg.ai{border:1px solid var(--line);border-left:4px solid #5b4a8a}.msg.err{border:1px solid #b4532a;color:#b4532a}
.row{flex-wrap:wrap}.row button{white-space:nowrap}#askmodel{font:13px var(--body);padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);margin-left:auto}/*ASK-END*/
@media (max-width:1100px){#main{grid-template-columns:200px minmax(0,1fr) 340px}}
</style></head><body>
<header>
  <h1>ZDLRA code tracer</h1><span class="rev" id="rev"></span>
  <div id="search"><input id="q" placeholder="Find a file, variable, function, filter or concept…" autocomplete="off"><div id="results"></div></div>
  <span class="spacer"></span>
  <button id="back" title="Back (Alt+Left)">← Back</button>
  <button id="theme" title="Light / dark">Light/Dark</button>
</header>
<div id="main">
  <aside id="side"><div class="tabs"><button data-tab="files" class="on">Files</button><button data-tab="outline">Outline</button><button data-tab="concepts">Concepts</button></div><div id="sidebody"></div></aside>
  <section id="center"><div id="filehead"></div><div id="code" tabindex="0"></div></section>
  <aside id="explain"></aside>
</div>
<script>const DATA=/*__DATA__*/null;</script>
<script>
"use strict";
const F = DATA.files, S = DATA.symbols, GL = DATA.glossary, CH = DATA.chains;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = {file: null, line: null, focus: null}, tab = "files";

// ---------- theme ----------
const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
document.documentElement.dataset.theme = localStorage.getItem("tracer-theme") || (prefersDark ? "dark" : "light");
$("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; localStorage.setItem("tracer-theme", t); };
$("#rev").textContent = DATA.branch + " @ " + DATA.rev;
if (DATA.title) { document.querySelector("header h1").textContent = DATA.title; document.title = DATA.title; }
if (DATA.placeholder) $("#q").placeholder = DATA.placeholder;
const LEARN = DATA.learning || "Ansible";
const NODES = DATA.nodes || {}, CALLS = DATA.calls || {}, FCH = DATA.fchains || {};
// `code` and {{L:n}} (a line of this file) in the plain-words sentences
function md(s) {
  return esc(s).replace(/`([^`]*)`/g, (m, c) => `<code>${c}</code>`).replace(/\{\{L:(\d+)\}\}/g, (m, n) => where(cur.file, +n - 1, "line " + n))
    .replace(/\b(lines?) (\d+)( (?:to|and) (\d+))?/g, (m, w, a, rest, b) => `${w} ${where(cur.file, +a - 1, a)}${rest ? rest.replace(b, where(cur.file, +b - 1, b)) : ""}`);
}
function nodeLink(k, l, f) {
  const n = NODES[k];
  if (!n) return esc(k);
  return where(f != null ? f : n.f, l != null ? l : n.l, n.label + (l != null ? " · line " + (l + 1) : ""));
}
$("#back").onclick = () => history.back();

// ---------- navigation (the URL hash is file:line, so Back works) ----------
function go(file, line, focus) {
  const h = "#" + encodeURIComponent(file) + (line != null ? ":" + (line + 1) : "") + (focus ? "|" + encodeURIComponent(focus) : "");
  if (location.hash !== h) location.hash = h; else route();
}
function route() {
  let h = decodeURIComponent(location.hash.slice(1)), focus = null;
  if (h.includes("|")) { [h, focus] = [h.slice(0, h.indexOf("|")), h.slice(h.indexOf("|") + 1)]; }
  let m = h.match(/^(.*?)(?::(\d+))?$/), file = m && m[1], line = m && m[2] ? +m[2] - 1 : null;
  if (!F[file]) { file = DATA.entries[0]; line = null; }
  const changed = file !== cur.file;
  cur = {file, line, focus};
  if (changed) renderFile();
  select(line, !changed || line != null);
  renderSide();
}
window.addEventListener("hashchange", route);

// ---------- syntax colouring ----------
function colour(text, lang) {
  const cls = new Array(text.length).fill("");
  const paint = (re, c, grp) => { let m; re.lastIndex = 0; while ((m = re.exec(text))) { let s = m.index, e = s + m[0].length; if (grp) { s = m.index + m[0].indexOf(m[grp]); e = s + m[grp].length; } for (let i = s; i < e; i++) cls[i] = c; if (!m[0].length) re.lastIndex++; } };
  if (lang === "yaml" || lang === "jinja") {
    paint(/"(?:[^"\\]|\\.)*"|'[^']*'/g, "str");
    paint(/^\s*(?:- )?([A-Za-z_][\w.]*)(?=:(\s|$))/g, "key", 1);
    paint(/\b(ansible\.(builtin|posix|legacy)\.\w+)\b/g, "mod");
    paint(/\b(true|false|yes|no)\b/g, "num");
    paint(/\{\{.*?\}\}|\{%.*?%\}/g, "jin");
    paint(/(^|\s)#.*$/g, "com");
  } else if (lang === "bash" || lang === "powershell" || lang === "ini") {
    paint(/"(?:[^"\\]|\\.)*"|'[^']*'/g, "str");
    paint(/\$\{?[A-Za-z_][\w]*\}?|\$[0-9#?@*$]/g, "jin");
    paint(/^\s*([A-Za-z_][\w]*)(?=\(\))/g, "mod", 1);
    paint(/\b(if|then|else|elif|fi|for|while|do|done|case|esac|in|function|return|local|exit)\b/g, "key");
    paint(/(^|\s)#.*$/g, "com");
  } else if (lang === "python") {
    paint(/"(?:[^"\\]|\\.)*"|'[^']*'/g, "str");
    paint(/\b(def|class|return|for|in|if|elif|else|import|not|and|or|None|True|False)\b/g, "key");
    paint(/^\s*def\s+(\w+)/g, "mod", 1);
    paint(/#.*$/g, "com");
  } else if (lang === "markdown") {
    paint(/^#+ .*$/g, "key"); paint(/`[^`]*`/g, "jin");
  }
  return cls;
}
function lineHTML(file, i) {
  const f = F[file], text = f.lines[i], cls = colour(text, f.lang);
  const toks = (f.tokens[i] || []).slice().sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  const run = (s, e) => { let j = s; while (j < e) { let k = j; while (k < e && cls[k] === cls[j]) k++; const t = esc(text.slice(j, k)); out += cls[j] ? `<span class="${cls[j]}">${t}</span>` : t; j = k; } };
  for (const [s, e, kind, key] of toks) {
    if (s < pos) continue;
    run(pos, s);
    out += `<a class="k-${kind}" data-k="${esc(key)}" data-kind="${kind}">${esc(text.slice(s, e))}</a>`;
    pos = e;
  }
  run(pos, text.length);
  return out || " ";
}

// ---------- the file ----------
function renderFile() {
  const f = F[cur.file];
  const incoming = f.incoming.filter(x => x[2] !== "mention");
  const mentions = f.incoming.filter(x => x[2] === "mention");
  let h = `<span class="path">${esc(cur.file)}</span><span class="meta">${f.lines.length} lines · ${esc(kindName(f))}</span>`;
  if (f.summary) h += `<details open><summary>What this file is for (from its opening comment)</summary><pre>${esc(f.summary)}</pre></details>`;
  if (f.error) h += `<p class="help">Could not read this as YAML: ${esc(f.error)}</p>`;
  $("#filehead").innerHTML = h;
  const code = $("#code");
  let html = "";
  for (let i = 0; i < f.lines.length; i++) html += `<div class="L" data-i="${i}"><span class="n">${i + 1}</span><span class="t">${lineHTML(cur.file, i)}</span></div>`;
  code.innerHTML = html;
  code.scrollTop = 0;
}
function kindName(f) {
  return ({playbook: "Ansible playbook (where a run starts)", tasks: "Ansible tasks file", defaults: "role defaults (variables)", vars: "inventory variables",
    inventory: "Ansible inventory (hosts and groups)", config: "YAML settings", bash: "Bash script", python: "Python (Ansible plugin)", jinja: "Jinja template",
    ini: "Ansible configuration", markdown: "notes", powershell: "PowerShell script (not explained here)", text: "text",
    conf: "settings file (the script reads it with source)"})[f.kind] || f.kind;
}
$("#code").addEventListener("click", e => {
  const a = e.target.closest("a[data-k]"), L = e.target.closest(".L");
  if (!L) return;
  const i = +L.dataset.i;
  if (a && (a.dataset.kind === "file") && !a.dataset.k.startsWith("glob:") && (e.metaKey || e.ctrlKey || e.detail === 2)) { go(a.dataset.k, null); return; }
  go(cur.file, i, a ? a.dataset.k : null);
});

function select(line, scroll) {
  document.querySelectorAll(".L.sel,.L.task").forEach(n => n.classList.remove("sel", "task"));
  const f = F[cur.file];
  if (line != null) {
    const t = f.tasks[f.taskOf[line]];
    if (t) for (let i = t.start; i <= t.end; i++) { const n = $("#code").children[i]; if (n) n.classList.add("task"); }
    const n = $("#code").children[line];
    if (n) { n.classList.add("sel"); if (scroll) { const c = $("#code"), r = n.offsetTop; if (r < c.scrollTop + 40 || r > c.scrollTop + c.clientHeight - 80) c.scrollTop = r - c.clientHeight / 3; } }
  }
  renderExplain();
}

// keyboard: up/down (or j/k) move between lines
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const f = F[cur.file];
  if (["ArrowDown", "j"].includes(e.key) || ["ArrowUp", "k"].includes(e.key)) {
    e.preventDefault();
    const d = (e.key === "ArrowDown" || e.key === "j") ? 1 : -1;
    const n = Math.max(0, Math.min(f.lines.length - 1, (cur.line == null ? -1 : cur.line) + d));
    history.replaceState(null, "", "#" + encodeURIComponent(cur.file) + ":" + (n + 1));
    cur.line = n; cur.focus = null; select(n, true); renderSide();
  } else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

// ---------- explanations ----------
function concept(key) {
  if (GL[key]) return GL[key];
  return null;
}
function lineConcepts(f, i) {
  const keys = (f.concepts[i] || []).slice(), text = f.lines[i];
  if (f.lang === "yaml") {
    if (/^\s*- /.test(text) && !keys.includes("yaml:comment")) keys.unshift("yaml:list_item");
    if (/:\s*["']\{\{/.test(text) && !keys.includes("yaml:quoted")) keys.push("yaml:quoted");
  }
  return keys;
}
function where(f, l, label) { return `<a class="where" onclick="go('${esc(f)}',${l})">${esc(label || (f.split("/").pop() + ":" + (l + 1)))}</a>`; }
function srcLine(f, l) { return F[f] ? `<span class="src">${esc(F[f].lines[l].trim().slice(0, 110))}</span>` : ""; }

function symbolCard(key, hi) {
  if (key.startsWith("glob:")) {
    const fs = key.slice(5).split("|");
    return `<div class="card conn ${hi ? "hi" : ""}"><b>Leads to one of ${fs.length} files</b><p>The file name has a variable in it, so which file runs depends on its value at run time.</p><ul>${fs.map(p => `<li><a onclick="go('${esc(p)}',null)">${esc(p.split("/").pop())}</a></li>`).join("")}</ul></div>`;
  }
  if (F[key]) {
    const f = F[key];
    return `<div class="card conn ${hi ? "hi" : ""}"><b>Opens <a onclick="go('${esc(key)}',null)">${esc(key)}</a></b><p>${esc(kindName(f))}${f.summary ? ": " + esc(f.summary.split("\n").slice(0, 3).join(" ")) : ""}</p><p class="help">Click the link (or double-click the name in the code) to open it.</p></div>`;
  }
  if (key.startsWith("role:")) {
    const r = key.slice(5);
    const fs = Object.keys(F).filter(p => p.startsWith(`ansible/roles/${r}/`));
    return `<div class="card conn ${hi ? "hi" : ""}"><b>Role <code>${esc(r)}</code></b><p>A role is a folder of related tasks, defaults and files under ansible/roles/${esc(r)}/. Its tasks/ files are run with include_role, its defaults/main.yml supplies default variables, its files/ and templates/ are copied to the hosts.</p><ul>${fs.slice(0, 12).map(p => `<li><a onclick="go('${esc(p)}',null)">${esc(p.slice(15 + r.length))}</a></li>`).join("")}${fs.length > 12 ? `<li>… ${fs.length - 12} more in Files</li>` : ""}</ul></div>`;
  }
  const s = S[key];
  if (!s) { const g = concept(key); return g ? `<div class="card concept ${hi ? "hi" : ""}"><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div>` : ""; }
  if (s.kind === "dyn") {
    return `<div class="card conn ${hi ? "hi" : ""}"><b><span class="pill">Function picked at run time</span><code>${esc(s.title)}</code></b><p>The function's name is built from a variable, so which one runs depends on its value. It can be any of these ${s.defs.length}:</p><ul>${s.defs.map(d => `<li>${where(d.f, d.l, d.how)}${d.doc ? ` <span class="help">${esc(d.doc)}</span>` : ""}</li>`).join("")}</ul></div>`;
  }
  const kindTxt = {var: "Ansible variable", shvar: "Shell variable", func: "Function", filter: "Custom Jinja filter", test: "Custom Jinja test"}[s.kind] || s.kind;
  let h = `<div class="card conn ${hi ? "hi" : ""}"><b><span class="pill">${kindTxt}</span><code>${esc(s.title)}</code></b>`;
  const magic = GL["magic:" + s.title];
  if (magic && s.kind === "var") h += `<p>${esc(magic[1])}</p>`;
  if (s.defs.length) {
    h += `<p>${s.defs.length === 1 ? "Defined" : `Defined in ${s.defs.length} places`}:</p><ul>`;
    for (const d of s.defs.slice(0, 12)) h += `<li>${where(d.f, d.l)} <span class="help">${esc(d.how)}</span>${srcLine(d.f, d.l)}${d.doc ? `<div class="doc">${esc(d.doc)}</div>` : ""}</li>`;
    if (s.defs.length > 12) h += `<li class="help">… and ${s.defs.length - 12} more</li>`;
    h += `</ul>`;
    if (s.kind === "var" && s.defs.some(d => /role default/.test(d.how))) h += `<p class="help">A role default can be overridden in inventory group_vars, or with -e ${esc(s.title)}=… on the command line.</p>`;
  } else if (s.kind === "var") {
    h += `<p class="help">Not set anywhere in the code: it comes from the command line (-e ${esc(s.title)}=…) or Ansible itself.</p>`;
  }
  if (s.kind === "func" && s.defs.length) {
    const fk = key;
    const c = CALLS[fk];
    if (c && c.callers.length) h += `<p class="help">Called from ${c.callers.length} place${c.callers.length > 1 ? "s" : ""}; open the definition to see them all and the chain of calls that leads there.</p>`;
  }
  if (s.kind === "shvar" && s.value != null && s.defs.length) h += `<p class="help">Default value: <code>${esc(s.value.slice(0, 120))}</code></p>`;
  const uses = s.uses;
  if (uses.length) {
    const id = "u" + Math.random().toString(36).slice(2);
    h += `<p>Used in ${uses.length} place${uses.length > 1 ? "s" : ""}:</p><ul id="${id}">`;
    uses.forEach((u, n) => { h += `<li ${n >= 15 ? 'style="display:none"' : ""}>${where(u.f, u.l)}${srcLine(u.f, u.l)}</li>`; });
    h += `</ul>${uses.length > 15 ? `<a onclick="document.querySelectorAll('#${id} li').forEach(x=>x.style.display='');this.remove()">Show all ${uses.length}</a>` : ""}`;
  }
  return h + `</div>`;
}

function taskCard(f, t) {
  const g = GL["module:" + t.module];
  const chain = [];
  let p = t.parent;
  while (p != null) { chain.unshift(f.tasks[p]); p = f.tasks[p].parent; }
  let h = `<div class="card task"><b>${t.kind === "function" ? "Inside the function " : t.kind === "heredoc" ? "Inside the here-document " : t.module === "block" ? "Inside the block " : "Part of the task "}“${esc(t.name || "(no name)")}”</b>`;
  h += `<p class="where">${where(cur.file, t.start, "lines " + (t.start + 1) + "–" + (t.end + 1))}</p>`;
  if (chain.length) h += `<p class="help">Inside: ${chain.map(c => where(cur.file, c.start, "“" + (c.name || c.module) + "”")).join(" › ")}</p>`;
  if (t.comment) h += `<div class="doc">${esc(t.comment)}</div>`;
  if (g && t.kind !== "function") h += `<p><b style="display:inline">${esc(g[0])}:</b> ${esc(g[1])}</p>`;
  const kws = (t.keys || []).filter(k => ["when", "loop", "delegate_to", "register", "until", "block", "rescue", "tags", "no_log", "run_once"].includes(k));
  if (kws.length) h += `<p class="help">This task also uses: ${kws.map(k => `<code>${k}</code>`).join(", ")}${kws.includes("when") ? " (it may be skipped)" : ""}${kws.includes("loop") ? " (it repeats)" : ""}${kws.includes("delegate_to") ? " (it runs on another machine)" : ""}.</p>`;
  if (t.leads_to && t.leads_to.length) h += `<p>Runs: ${t.leads_to.map(p => `<a onclick="go('${esc(p)}',null)">${esc(p.split("/").pop())}</a>`).join(", ")}</p>`;
  h += `</div>`;
  if (t.key) h += callsHTML(t.key, t.name);
  else if (t.kind === "heredoc") {
    const k = Object.keys(NODES).find(k => k === "top:" + cur.file + "@" + (t.start + 2));
    if (k) h += callsHTML(k, "this script");
  }
  return h;
}
function callsHTML(key, name) {
  const c = CALLS[key] || {callers: [], calls: []};
  let h = "";
  const ch = FCH[key];
  if (ch && ch.length) {
    h += `<h2>How a run gets here</h2><p class="help">Each line is a chain of calls, from a script you run down to ${esc(name)}.</p>`;
    h += ch.map(path => `<div class="chain">${path.map(([k, f, l, how]) => nodeLink(k, l, f) + (how && how !== "call" ? ` <span class="help">(${esc(how)})</span>` : "")).join('<span class="arrow">→</span>')}<span class="arrow">→</span><b>${esc(name)}</b></div>`).join("");
  } else if (!c.callers.length) {
    h += `<h2>How a run gets here</h2><p class="help">Nothing in this repo calls ${esc(name)} by name${key.startsWith("func:") ? "" : ""}.</p>`;
  }
  const list = (arr, id, isCaller) => {
    let out = `<ul class="calls" id="${id}">`;
    arr.forEach(([k, f, l, how], n) => {
      const site = where(f, l, (NODES[k] ? NODES[k].label : k) + " · line " + (l + 1));
      out += `<li ${n >= 12 ? 'style="display:none"' : ""}>${isCaller ? site : where(NODES[k] ? NODES[k].f : f, NODES[k] ? NODES[k].l : l, NODES[k] ? NODES[k].label : k) + ` <span class="how">at ${where(f, l, "line " + (l + 1))}</span>`}${how && how !== "call" ? ` <span class="how">${esc(how)}</span>` : ""}${isCaller ? srcLine(f, l) : ""}</li>`;
    });
    return out + `</ul>` + (arr.length > 12 ? `<a onclick="document.querySelectorAll('#${id} li').forEach(x=>x.style.display='');this.remove()">Show all ${arr.length}</a>` : "");
  };
  if (c.callers.length) h += `<h2>Called from (${c.callers.length})</h2><div class="card conn">${list(c.callers, "cr" + Math.random().toString(36).slice(2), true)}</div>`;
  const uniq = [], seen = new Set();
  for (const x of c.calls) if (!seen.has(x[0])) { seen.add(x[0]); uniq.push(x); }
  if (uniq.length) h += `<h2>It calls (${uniq.length})</h2><div class="card conn">${list(uniq, "cl" + Math.random().toString(36).slice(2), false)}</div>`;
  return h;
}
function topLevelCard(f, i) {
  let h = `<div class="card task"><b>Outside any function</b><p>Bash reads a script from the top and runs each line outside a function when it gets to it. A function definition is only remembered; its lines run later, when something calls it.</p>`;
  if (f.start === i) h += `<p>This is the line where the script's real work starts: everything above it only set defaults and defined functions.</p>`;
  else if (f.start != null) h += `<p>In this script the real work starts at ${where(cur.file, f.start, "line " + (f.start + 1))}${f.start > i ? ", after every function is defined" : ""}.</p>`;
  h += `</div>`;
  const key = "top:" + cur.file;
  if (CALLS[key] && CALLS[key].callers.length) h += `<h2>This script is run by</h2><div class="card conn"><ul class="calls">${CALLS[key].callers.map(([k, ff, l, how]) => `<li>${where(ff, l, (NODES[k] ? NODES[k].label : k) + " · line " + (l + 1))} <span class="how">${esc(how)}</span>${srcLine(ff, l)}</li>`).join("")}</ul></div>`;
  return h;
}
// The nearest comment block above line i, inside the same function (not its header comment).
function noteAbove(f, i) {
  if (/^\s*#/.test(f.lines[i]) || !f.lines[i].trim()) return null;
  const t = f.tasks[f.taskOf[i]];
  const lo = t ? t.start + 1 : 0;
  const ind = x => x.match(/^\s*/)[0].length, mine = ind(f.lines[i]);
  let j = i - 1;
  while (j >= lo && !/^\s*#/.test(f.lines[j])) {
    const l = f.lines[j];
    if (l.trim() === "") return null;
    // left this block, or passed the end of another one: that comment is about something else
    if (ind(l) < mine || (ind(l) === mine && /^\s*(fi|done|esac|\})\b/.test(l))) return null;
    j--;
  }
  if (j < lo) return null;
  let s = j;
  while (s - 1 >= lo && /^\s*#/.test(f.lines[s - 1])) s--;
  if (/^#!/.test(f.lines[s])) return null;
  const text = f.lines.slice(s, j + 1).map(x => x.replace(/^\s*# ?/, "")).filter(x => !/^-{5,}$/.test(x.trim())).join("\n").trim();
  return text ? {start: s, text} : null;
}

function chainsHTML(file) {
  const cs = CH[file];
  if (!cs) return "";
  return cs.slice(0, 5).map(c => `<div class="chain">${c.map(([f, l]) => where(f, l, f.split("/").pop() + ":" + (l + 1))).join('<span class="arrow">→</span>')}<span class="arrow">→</span><b>${esc(file.split("/").pop())}</b></div>`).join("") + (cs.length > 5 ? `<p class="help">… and ${cs.length - 5} more paths</p>` : "");
}

function renderExplain() {
  const f = F[cur.file], i = cur.line, ex = $("#explain");
  let h = "";
  if (i == null) {
    h += DATA.help ? `<h2>How to use this</h2><p class="help">${esc(DATA.help)}</p>` : `<h2>How to use this</h2><p class="help">Click any line of code to see what it does, the Ansible or Bash idea behind it, and where it connects. Underlined words are links: click one to see where it is defined and used. Double-click a file name to open it. <kbd>↑</kbd>/<kbd>↓</kbd> move line by line, <kbd>/</kbd> searches, Back returns to where you were.</p>`;
    h += fileContext(f);
    ex.innerHTML = h; return;
  }
  const text = f.lines[i];
  h += `<div class="snip"><span class="help">${esc(cur.file.split("/").pop())}:${i + 1}</span>\n${esc(text) || " "}</div>`;
  const plain = f.plain && f.plain[i];
  if (plain && plain.length) h += `<h2>In plain words</h2><div class="card plain">${plain.map(p => `<p>${md(p)}</p>`).join("")}</div>`;
  const above = f.plain ? noteAbove(f, i) : null;
  if (above) h += `<div class="card note"><b>The comment above this part</b><div class="doc">${esc(above.text)}</div><p class="help">${where(cur.file, above.start, "line " + (above.start + 1))}</p></div>`;

  // what the line connects to
  const toks = f.tokens[i] || [];
  const seen = new Set(), conns = [];
  for (const [s, e, kind, key] of toks) {
    if (seen.has(key) || kind === "gloss" || kind === "module") continue;
    seen.add(key); conns.push(key);
  }
  if (cur.focus && conns.includes(cur.focus)) { conns.splice(conns.indexOf(cur.focus), 1); conns.unshift(cur.focus); }
  if (cur.focus && !conns.includes(cur.focus) && (S[cur.focus] || GL[cur.focus])) conns.unshift(cur.focus);

  let connH = "";
  if (conns.length) {
    connH = `<h2>Where it connects</h2>`;
    conns.forEach(k => { connH += symbolCard(k, k === cur.focus); });
  }
  if (cur.focus) h += connH;

  // concepts on this line
  const cks = lineConcepts(f, i).filter(k => !(cur.focus && k === cur.focus));
  const notes = f.notes[i] || [];
  if (notes.length || cks.length) {
    h += `<h2>What this line is</h2>`;
    for (const n of notes) h += `<div class="card note"><p>${esc(n)}</p></div>`;
    for (const k of cks) { const g = concept(k); if (g) h += `<div class="card concept"><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div>`; }
  }
  if (!text.trim()) h += `<p class="empty">A blank line: it separates ${LEARN === "Bash" ? "parts of the script" : "tasks or sections"}, and means nothing to ${esc(LEARN)}.</p>`;

  if (!cur.focus) h += connH;

  const t = f.tasks[f.taskOf[i]];
  if (t) h += `<h2>The bigger picture</h2>` + taskCard(f, t);
  else if (f.lang === "bash" && f.plain && text.trim() && !/^\s*#/.test(text)) h += `<h2>The bigger picture</h2>` + topLevelCard(f, i);
  h += fileContext(f, !!t);
  h += askBox(f, i, t);
  ex.innerHTML = h;
  ex.scrollTop = 0;
  wireAsk();
}

function fileContext(f, small) {
  let h = "";
  if (FCH["file:" + cur.file]) h += `<h2>How a run gets to this file</h2><p class="help">Each line is a chain of calls from a script you run to the line that reads this file.</p>` + FCH["file:" + cur.file].map(path => `<div class="chain">${path.map(([k, ff, l, how]) => nodeLink(k, l, ff) + (how && how !== "call" ? ` <span class="help">(${esc(how)})</span>` : "")).join('<span class="arrow">→</span>')}<span class="arrow">→</span><b>${esc(cur.file.split("/").pop())}</b></div>`).join("");
  const ch = chainsHTML(cur.file);
  if (ch) h += `<h2>How a run gets to this file</h2><p class="help">Each line is a path from a playbook you run, through the includes, to here.</p>` + ch;
  const inc = f.incoming.filter(x => x[2] !== "mention");
  const men = f.incoming.filter(x => x[2] === "mention" && !inc.some(y => y[0] === x[0]));
  if (inc.length) h += `<h2>Included or copied from</h2><div class="card conn"><ul>${inc.slice(0, 30).map(([ff, l, how]) => `<li>${where(ff, l)} <span class="help">${esc(how)}</span>${srcLine(ff, l)}</li>`).join("")}</ul></div>`;
  if (men.length) h += `<h2>Mentioned in</h2><div class="card note"><ul>${men.slice(0, 20).map(([ff, l]) => `<li>${where(ff, l)}${srcLine(ff, l)}</li>`).join("")}</ul>${men.length > 20 ? `<p class="help">… and ${men.length - 20} more</p>` : ""}</div>`;
  if (!ch && DATA.entries.includes(cur.file)) h += `<h2>Where it starts</h2><div class="card note"><p>This is a starting point: you run it yourself${f.lang === "yaml" ? " with ansible-playbook" : ""}.${inc.length ? "" : " Nothing includes it."}</p>${f.start != null ? `<p>Its work begins at ${where(cur.file, f.start, "line " + (f.start + 1))}, the call at the bottom; everything above it only sets defaults and defines functions.</p>` : ""}</div>`;
  return h;
}

// ---------- ask Claude ----------
// Only in the trainer build (docs/trainer/), served by the Exadata Trainer at /tracer/...: questions go to the trainer's
// own server (POST /ai/tracer), which asks Claude through the Claude Code that the Claude desktop app installs. No API key
// is needed and none is kept here. The standalone build (docs/code-tracer*.html) has none of this code.
const MODELS = [["claude-sonnet-5-5", "Claude Sonnet 5.5 (quicker)"], ["claude-opus-5-5", "Claude Opus 5.5 (deeper)"]];
const convs = {};            // "file:line" -> [{q, a, note}], kept while the page is open
let claudeOk = null;         // null until /ai/status answers
fetch("/ai/status").then(r => r.json()).then(s => { claudeOk = !!s.available; }).catch(() => { claudeOk = false; });
const tmodel = () => { const m = localStorage.getItem("tracer-claude-model"); return MODELS.some(x => x[0] === m) ? m : MODELS[0][0]; };

function askBox(f, i, t) {
  const at = cur.file + ":" + i;
  return `<h2>Ask Claude about this line</h2>
  <div id="chat">${chatHtml(convs[at] || [])}</div>
  <textarea id="askq" placeholder="Ask about this line… (Enter sends, Shift+Enter for a new line)">${esc(localStorage.getItem("tracer-q") || "")}</textarea>
  <div class="row"><button id="asksend">Ask Claude</button><button id="asknew" title="Forget this conversation">New conversation</button>
    <select id="askmodel" title="Which Claude answers">${MODELS.map(([id, label]) => `<option value="${id}"${id === tmodel() ? " selected" : ""}>${esc(label)}</option>`).join("")}</select></div>
  <p class="help" id="askok">Claude sees this file with the line marked, the ${LEARN === "Bash" ? "function" : "task"} around it, and your question. Follow-up questions keep the conversation for this line. An answer takes a few seconds to a minute.</p>`;
}

function md(s) {
  // Small, safe Markdown: escape everything first, then add code blocks, inline code, bold, lists and paragraphs.
  const blocks = [];
  s = s.replace(/```[^\n]*\n([\s\S]*?)(```|$)/g, (m, code) => { blocks.push(code); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  let h = esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.split(/\n{2,}/).map(p => {
    if (/^\u0000\d+\u0000$/.test(p.trim())) return p.trim();
    const lines = p.split("\n");
    if (lines.every(l => /^\s*([-*]|\d+\.)\s/.test(l))) return "<ul>" + lines.map(l => "<li>" + l.replace(/^\s*([-*]|\d+\.)\s/, "") + "</li>").join("") + "</ul>";
    if (/^#{1,4}\s/.test(p)) return "<p><b>" + p.replace(/^#{1,4}\s/, "") + "</b></p>";
    return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
  }).join("");
  return h.replace(/\u0000(\d+)\u0000/g, (m, n) => `<pre class="snip">${esc(blocks[+n])}</pre>`);
}
function chatHtml(turns) {
  return turns.map(x => `<div class="msg me">${esc(x.q)}</div>` +
    (x.a != null ? `<div class="msg ai">${md(x.a)}</div>` : x.err ? `<div class="msg err">${esc(x.err)}</div>` : `<div class="msg ai"><span class="help">Claude is thinking…</span></div>`)).join("");
}

// What Claude is shown: the whole file (or 300 lines around the line in a very long one), the line marked with >>.
function contextFor(file, i) {
  const f = F[file], t = f.tasks[f.taskOf[i]];
  const big = f.lines.length > 1500;
  const s = big ? Math.max(0, (t ? t.start : i) - 150) : 0, e = big ? Math.min(f.lines.length - 1, (t ? t.end : i) + 150) : f.lines.length - 1;
  let code = "";
  for (let n = s; n <= e; n++) code += (n === i ? ">> " : "   ") + String(n + 1).padStart(4) + "  " + f.lines[n] + "\n";
  const plain = f.plain && f.plain[i] ? `\nThe tracer's own plain-words reading of that line (worked out by rules, so it may be clumsy): ${String(f.plain[i]).replace(/<[^>]+>/g, "")}\n` : "";
  return `Repository: zdlra-patching (${DATA.branch} @ ${DATA.rev}). File: ${file}${big ? ` (lines ${s + 1}-${e + 1} of ${f.lines.length})` : ""}.\n` +
    `The line asked about is line ${i + 1}, marked with >>` + (t ? `, inside the ${t.kind === "function" ? "function" : "task"} "${t.name}" (lines ${t.start + 1}-${t.end + 1})` : "") + `.\n${plain}\n${code}`;
}

function wireAsk() {
  const q = $("#askq"); if (!q) return;
  const file = cur.file, line = cur.line, at = file + ":" + line;
  if (claudeOk === false) $("#askok").textContent = "Claude Code was not found on this PC, so the trainer cannot ask Claude. Open the Claude desktop app once (or run \"Claude Login.bat\"), then reload.";
  q.oninput = e => localStorage.setItem("tracer-q", e.target.value);
  q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } e.stopPropagation(); };
  $("#askmodel").onchange = e => localStorage.setItem("tracer-claude-model", e.target.value);
  $("#askmodel").onkeydown = e => e.stopPropagation();
  $("#asknew").onclick = () => { delete convs[at]; $("#chat").innerHTML = ""; };
  $("#asksend").onclick = send;

  async function send() {
    const turns = convs[at] = convs[at] || [];
    if (turns.some(x => x.a == null && !x.err)) return;   // one question at a time per line
    const question = q.value.trim() || (LEARN === "Bash" ? "Explain what the marked line does, and the Bash idea behind it." : "Explain what the marked line does, and the Ansible (or Bash) idea behind it.");
    const history = turns.filter(x => x.a != null).flatMap(x => [{role: "user", content: x.q}, {role: "assistant", content: x.a}]);
    const turn = {q: question}; turns.push(turn);
    q.value = ""; localStorage.removeItem("tracer-q");
    show();
    try {
      const r = await fetch("/ai/tracer", {method: "POST", headers: {"Content-Type": "application/json", "X-Trainer": "1"},
        body: JSON.stringify({learning: LEARN, context: contextFor(file, line), history, question, model: tmodel()})});
      const j = r.ok ? await r.json() : {error: r.status === 404 ? "This trainer has no tracer support yet: restart the Exadata Trainer after updating it." : `The trainer answered ${r.status}.`};
      if (j.error) turn.err = j.error; else turn.a = j.answer;
    } catch (err) { turn.err = "Could not reach the Exadata Trainer. Is it still running?"; }
    if (turn.err) {   // shown once, then dropped so it is not sent as history; the question goes back in the box
      show(); turns.splice(turns.indexOf(turn), 1);
      const box = $("#askq"); if (cur.file === file && cur.line === line && box && !box.value) box.value = question;
      return;
    }
    show();
  }
  function show() {   // only if the learner is still on that line
    if (cur.file !== file || cur.line !== line) return;
    const c = $("#chat"); if (!c) return;
    c.innerHTML = chatHtml(convs[at] || []);
    const last = c.lastElementChild; if (last) last.scrollIntoView({block: "nearest"});
    const b = $("#asksend"); if (b) b.disabled = (convs[at] || []).some(x => x.a == null && !x.err);
  }
}

// ---------- sidebar ----------
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b)); renderSide(); });
function renderSide() {
  const body = $("#sidebody");
  if (tab === "files") {
    const groups = {};
    for (const p of Object.keys(F).sort()) { const d = p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "(top)"; (groups[d] = groups[d] || []).push(p); }
    const order = Object.keys(groups).sort((a, b) => (a === "(top)" ? -1 : b === "(top)" ? 1 : 0) || (a.startsWith("ansible") ? 0 : 1) - (b.startsWith("ansible") ? 0 : 1) || a.localeCompare(b));
    let h = `<div class="dir">Start here (★ = you run it)</div>` + DATA.entries.map(p => `<a class="fl ${p === cur.file ? "on" : ""}" onclick="go('${p}',null)" title="${p}"><span class="star">★</span> ${esc(p)}</a>`).join("");
    for (const d of order) h += `<div class="dir">${esc(d)}/</div>` + groups[d].map(p => `<a class="fl ${p === cur.file ? "on" : ""}" onclick="go('${p}',null)" title="${p}">${esc(p.split("/").pop())}</a>`).join("");
    if (body.dataset.tab !== "files") { body.innerHTML = h; body.dataset.tab = "files"; }
    else { body.innerHTML = h; }
  } else if (tab === "outline") {
    const f = F[cur.file], cur_t = cur.line != null ? f.taskOf[cur.line] : null;
    let h = f.tasks.length ? "" : `<p class="empty" style="padding:0 12px">No tasks or functions in this file.</p>`;
    const secs = (f.sections || []).slice();
    for (const t of f.tasks) {
      while (secs.length && secs[0][0] <= t.start) { const [l, name] = secs.shift(); h += `<div class="dir" style="cursor:pointer" onclick="go(cur.file,${l})">${esc(name)}</div>`; }
      h += `<a class="ol ${t.id === cur_t ? "on" : ""}" style="padding-left:${10 + t.depth * 14}px" onclick="go(cur.file,${t.start})">${esc(t.name || "(" + t.module + ")")} <small>${t.start + 1}</small></a>`;
    }
    for (const [l, name] of secs) h += `<div class="dir" style="cursor:pointer" onclick="go(cur.file,${l})">${esc(name)}</div>`;
    body.innerHTML = h;
  } else {
    const groups = DATA.groups || [["module", "Modules (what a task does)"], ["task", "Task keywords"], ["play", "Play keywords"], ["filter", "Jinja filters"], ["test", "Jinja tests"], ["magic", "Built-in variables"], ["jinja", "Jinja syntax"], ["yaml", "YAML syntax"], ["bash", "Bash"], ["tool", "Oracle tools"], ["cfg", "ansible.cfg"]];
    let h = "";
    for (const [g, label] of groups) {
      h += `<div class="dir">${label}</div>`;
      for (const k of Object.keys(GL).filter(k => k.startsWith(g + ":"))) h += `<div class="gl"><b>${esc(GL[k][0])}</b><p>${esc(GL[k][1])}</p></div>`;
    }
    body.innerHTML = h;
  }
}

// ---------- search ----------
const index = [];
for (const p of Object.keys(F)) index.push({label: p.split("/").pop(), sub: p, go: () => go(p, null), kind: 0});
for (const [k, s] of Object.entries(S)) {
  const d = s.defs[0] || s.uses[0];
  if (d) index.push({label: s.title, sub: ({var: "variable", shvar: "shell variable", func: "function", filter: "filter", test: "test", dyn: "function picked at run time"}[s.kind] || s.kind) + " · " + d.f.split("/").pop(), go: () => go(d.f, d.l, k), kind: s.kind === "dyn" ? 3 : 1});
}
for (const [k, g] of Object.entries(GL)) if (!k.startsWith("note:") && !k.startsWith("cfilter") && !k.startsWith("ctest")) index.push({label: g[0], sub: "concept", go: () => { tab = "concepts"; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === "concepts")); renderSide(); $("#explain").innerHTML = `<h2>Concept</h2><div class="card concept"><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div>`; }, kind: 2});
let hits = [], hsel = 0;
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), r = $("#results");
  if (!q) { r.style.display = "none"; return; }
  hits = index.filter(x => x.label.toLowerCase().includes(q) || x.sub.toLowerCase().includes(q))
    .sort((a, b) => (a.label.toLowerCase().startsWith(q) ? 0 : 1) - (b.label.toLowerCase().startsWith(q) ? 0 : 1) || a.kind - b.kind || a.label.length - b.label.length).slice(0, 40);
  hsel = 0; showHits();
});
function showHits() {
  const r = $("#results");
  r.innerHTML = hits.map((x, n) => `<div data-n="${n}" class="${n === hsel ? "on" : ""}">${esc(x.label)}<small>${esc(x.sub)}</small></div>`).join("") || `<div>No match</div>`;
  r.style.display = "block";
}
$("#results").addEventListener("mousedown", e => { const d = e.target.closest("[data-n]"); if (d) { hits[+d.dataset.n].go(); $("#results").style.display = "none"; $("#q").blur(); } });
$("#q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { hsel = Math.min(hits.length - 1, hsel + 1); showHits(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { hsel = Math.max(0, hsel - 1); showHits(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[hsel]) { hits[hsel].go(); $("#results").style.display = "none"; $("#q").blur(); }
  else if (e.key === "Escape") { $("#results").style.display = "none"; $("#q").blur(); }
});
$("#q").addEventListener("blur", () => setTimeout(() => $("#results").style.display = "none", 150));

route();
</script>
</body></html>
